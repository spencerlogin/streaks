services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  backend:
    build:
      context: backend
      dockerfile: Dockerfile.prod
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD_FILE: /run/secrets/db-password
      DB_NAME: streaks
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: Lax
    secrets:
      - db-password
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db-password
      MYSQL_DATABASE: streaks
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/cnf:/etc/mysql/conf.d
    secrets:
      - db-password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --password=\"$$(cat /run/secrets/db-password)\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:

secrets:
  db-password:
    file: db/password.txt
