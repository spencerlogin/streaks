server {
    listen 80;
    server_name spencerlogin.com www.spencerlogin.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name spencerlogin.com www.spencerlogin.com;

    ssl_certificate /etc/letsencrypt/live/spencerlogin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spencerlogin.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api {
        proxy_pass http://backend:5050/api;
    }

    location /api/ {
        proxy_pass http://backend:5050;
    }

    location / {
        try_files $uri /index.html;
    }
}
