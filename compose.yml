services:
  frontend:
    build:
      context: frontend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - 8080:8080
    develop:
      watch:
        - action: sync
          path: frontend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: sync
          path: frontend/public
          target: /app/public
        - action: rebuild
          path: frontend/package.json

  backend:
    build:
      context: backend
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    stop_signal: SIGINT
    ports:
      - 5050:5050
    develop:
      watch:
        - action: sync
          path: backend
          target: /app
          ignore:
            - __pycache__/
            - .venv/
        - action: rebuild
          path: backend/requirements.txt
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5050/api/hello"]
      interval: 5s
      timeout: 1m
      retries: 5
      start_period: 15s

  mysql:
    image: mysql:latest
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
      - MYSQL_USER=spencer
      - MYSQL_DATABASE=streaks
      - MYSQL_PASSWORD=password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - 3306:3306
      - 33060:33060
    secrets:
      - db-password
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --password="$$(cat /run/secrets/db-password)" --silent']
      interval: 3s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8090:80
    environment:
      - PMA_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
        restart: true

volumes:
  mysql-data:

secrets:
  db-password:
    file: db/password.txt