services:
  frontend:
    build:
      context: frontend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    expose:
      - 8080
    develop:
      watch:
        - action: sync
          path: frontend
          target: /app
          ignore:
            - node_modules/
        - action: sync
          path: frontend/public
          target: /app/public
        - action: rebuild
          path: frontend/package.json
  backend:
    build:
      context: backend
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    stop_signal: SIGINT
    expose:
      - 5050
    develop:
      watch:
        - action: sync
          path: backend
          target: /app
          ignore:
            - __pycache__/
            - .venv/
        - action: rebuild
          path: backend/requirements.txt
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5050/api/hello"]
      interval: 5m
      timeout: 1m
      retries: 5
      start_period: 15s
  mysql:
    image: mysql:latest
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
      - MYSQL_USER=spencer
      - MYSQL_DATABASE=streaks
      - MYSQL_PASSWORD=twiKexU_5JXL5tM
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/cnf:/etc/mysql/conf.d
    expose:
      - 3306
      - 33060
    secrets:
      - db-password
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --password="$$(cat /run/secrets/db-password)" --silent']
      interval: 3s
      retries: 5
      start_period: 30s
  phpmyadmin:
    image: phpmyadmin
    restart: always
    expose:
      - 80
    environment:
      - PMA_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
  nginx:
    image: nginx:latest
    ports: 
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/www.spencerlogin.com.pem:/etc/nginx/www.spencerlogin.com.pem:ro
      - ./nginx/www.spencerlogin.com.key:/etc/nginx/www.spencerlogin.com.key:ro
    depends_on:
      frontend:
        condition: service_started
        restart: true
volumes:
  mysql-data:
secrets:
  db-password:
    file: db/password.txt
